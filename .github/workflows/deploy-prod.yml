name: Deploy Nexeron Portal PROD

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite PROD para confirmar o deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexeron-portal-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portal PROD
    runs-on: ubuntu-latest

    environment:
      name: Production

    steps:
      # ======================================================
      # Validação
      # ======================================================
      - name: Validate production deployment
        shell: bash
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"

          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERRO: deploy PROD somente pode ser executado pela branch main."
            exit 1
          fi

          if [ "${{ inputs.confirmation }}" != "PROD" ]; then
            echo "ERRO: confirmação inválida."
            echo "Digite exatamente PROD para autorizar o deploy."
            exit 1
          fi

          echo "Deploy PROD autorizado."

      # ======================================================
      # Variáveis
      # ======================================================
      - name: Validate production variables
        shell: bash
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "ERRO: AWS_REGION está vazia."
            exit 1
          fi

          if [ -z "${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}" ]; then
            echo "ERRO: AWS_PROD_DEPLOY_ROLE_ARN está vazia."
            exit 1
          fi

          if [ -z "${{ vars.NEXERON_PROD_INSTANCE_ID }}" ]; then
            echo "ERRO: NEXERON_PROD_INSTANCE_ID está vazia."
            exit 1
          fi

          echo "AWS_REGION: OK"
          echo "AWS_PROD_DEPLOY_ROLE_ARN: OK"
          echo "NEXERON_PROD_INSTANCE_ID: OK"

      # ======================================================
      # AWS OIDC
      # ======================================================
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: NEXERON-PORTAL-PROD-GitHubActions

      # ======================================================
      # SSM
      # ======================================================
      - name: Send deploy command
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.NEXERON_PROD_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Nexeron Portal PROD - GitHub Actions" \
            --parameters 'commands=["sudo /usr/local/sbin/nexeron-portal-prod-deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Esperar deploy
      # ======================================================
      - name: Wait for deployment
        id: wait
        shell: bash
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          echo "Aguardando deploy do Portal PROD..."

          for ATTEMPT in $(seq 1 120); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.NEXERON_PROD_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Tentativa $ATTEMPT/120 - Status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deploy PROD concluído com sucesso."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deploy terminou com erro: $STATUS"
                exit 1
                ;;

              Pending|InProgress|Delayed)
                sleep 10
                ;;

              *)
                echo "Status ainda não disponível: $STATUS"
                sleep 10
                ;;

            esac

          done

          echo "ERRO: deploy ultrapassou 20 minutos."
          exit 1

      # ======================================================
      # Mostrar logs
      # ======================================================
      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ vars.NEXERON_PROD_INSTANCE_ID }}" \
            --query '{
              Status:Status,
              ResponseCode:ResponseCode,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }'