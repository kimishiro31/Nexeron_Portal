name: Deploy Nexeron Portal DEV

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexeron-portal-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Portal DEV
    runs-on: ubuntu-latest

    steps:
      - name: Validate repository variables
        shell: bash
        run: |
          if [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "ERRO: AWS_REGION está vazia."
            exit 1
          fi

          if [ -z "${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}" ]; then
            echo "ERRO: AWS_DEV_DEPLOY_ROLE_ARN está vazia."
            exit 1
          fi

          if [ -z "${{ vars.NEXERON_DEV_INSTANCE_ID }}" ]; then
            echo "ERRO: NEXERON_DEV_INSTANCE_ID está vazia."
            exit 1
          fi

          echo "AWS_REGION: OK"
          echo "AWS_DEV_DEPLOY_ROLE_ARN: OK"
          echo "NEXERON_DEV_INSTANCE_ID: OK"

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: NEXERON-PORTAL-DEV-GitHubActions

      - name: Send deploy command
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.NEXERON_DEV_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Nexeron Portal DEV - GitHub Actions" \
            --parameters 'commands=["sudo /usr/local/sbin/nexeron-portal-dev-deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        id: wait
        shell: bash
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          echo "Aguardando deploy do Portal DEV..."

          for ATTEMPT in $(seq 1 120); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.NEXERON_DEV_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Tentativa $ATTEMPT/120 - Status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deploy concluído com sucesso."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deploy terminou com erro: $STATUS"
                exit 1
                ;;

              Pending|InProgress|Delayed)
                sleep 10
                ;;

              *)
                echo "Status ainda não disponível: $STATUS"
                sleep 10
                ;;

            esac

          done

          echo "ERRO: deploy ultrapassou 20 minutos."
          exit 1

      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ vars.NEXERON_DEV_INSTANCE_ID }}" \
            --query '{
              Status:Status,
              ResponseCode:ResponseCode,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }'
